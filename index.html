  <p>sample.txt の最終更新日：<span id="modified-date">読み込み中...</span></p>

  <script>
    async function fetchLastModified(url) {
      try {
        const response = await fetch(url, { method: "HEAD" });
        const lastModified = response.headers.get("Last-Modified");
        if (lastModified) {
          const date = new Date(lastModified);
          const formatted = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
          document.getElementById("modified-date").textContent = formatted;
        } else {
          document.getElementById("modified-date").textContent = "取得できませんでした";
        }
      } catch (error) {
        document.getElementById("modified-date").textContent = "エラーが発生しました";
        console.error("取得エラー:", error);
      }
    }

    fetchLastModified("./README.md");
  </script>
